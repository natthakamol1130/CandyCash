# ==============================================================================
# Deploy demo — Automatic Deployment & Rollback Pipeline to Google Cloud Run
# ==============================================================================
# Triggered automatically on push to `main` or manually via `workflow_dispatch`
# (with optional 40-character commit SHA `image_tag` for instant rollback).
#
# Pipeline Stages:
#   1. test   -> Reuses `.github/workflows/ci-docker.yml` (`test-and-docker`)
#   2. deploy -> Keyless WIF auth -> Build & push image `:IMAGE_TAG` ->
#                `deploy/release.sh` (digest pin, migrate+seed job, Cloud Run
#                service update) -> `deploy/smoke_test.py` -> Step summary
# ==============================================================================

name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Rollback: full 40-character commit SHA of an existing image. Empty = test, build and deploy current main."
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main' && !inputs.image_tag
    uses: ./.github/workflows/ci-docker.yml

  deploy:
    needs: test
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.test.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.image_tag != '' && needs.test.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: demo
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REPO_NAME: sb1c2a258
      SERVICE_NAME: sb1c2a258
      MIGRATE_JOB_NAME: sb1c2a258-migrate
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      ROLLBACK: ${{ inputs.image_tag != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false

      - name: Validate deployment settings
        env:
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT }}
        run: |
          test -n "$PROJECT_ID" && test -n "$REGION"
          test -n "$WIF_PROVIDER" && test -n "$WIF_SERVICE_ACCOUNT"
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "Image tag must be a full 40-character commit SHA."; exit 1; }

      - name: Authenticate to Google Cloud without a key (WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build and push image
        if: env.ROLLBACK != 'true'
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$SERVICE_NAME:$IMAGE_TAG"
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Verify image, migrate and deploy
        run: bash deploy/release.sh

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6.2.0
        with:
          python-version: "3.12"

      - name: Smoke test public URL
        env:
          SMOKE_EMAIL: ${{ vars.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: python3 deploy/smoke_test.py "$SERVICE_URL"

      - name: Record deployment
        run: |
          {
            echo "### CandyCash (sb1c2a258) demo deployment"
            echo "- Commit image tag: \`$IMAGE_TAG\`"
            echo "- Digest: \`$DEPLOYED_IMAGE\`"
            echo "- Rollback: $ROLLBACK"
            echo "- URL: $SERVICE_URL"
            echo "- Smoke test: passed (health, readiness/DB, frontend HTML, login page)."
            echo "- See smoke step for optional login round-trip status."
          } >> "$GITHUB_STEP_SUMMARY"
